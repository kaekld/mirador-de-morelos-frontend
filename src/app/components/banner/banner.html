<section class="bg-amber-950 relative h-[70vh] w-full">

  <app-slide-control class="absolute top-0 left-0 w-full z-10 pt-10 "></app-slide-control>

  <img [src]="banner().img" class="object-cover w-full h-full" />

  <div
    class="bg-linear-to-r from-gray-950 to-transparent absolute top-0 left-0 w-full h-full opacity-90"
  ></div>

  <div class="absolute top-0 left-0 w-full h-full px-8">
    <div class="py-25 flex flex-col gap-5 w-1/2">
      <!-- Title -->
      <div>
        <span class="text-7xl text-white font-bold">
          {{ banner().title }}
        </span>
      </div>

      <!-- Description  -->
      <div class="text-white text-xl">
        {{ banner().description }}
      </div>

      <!-- Button -->
      <a [class]="banner().buttonClass">
        {{ banner().buttonText }}
      </a>
    </div>
  </div>


</section>
