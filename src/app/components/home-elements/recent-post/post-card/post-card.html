<div class="relative cursor-pointer overflow-hidden group rounded-xl" [class]="cardWidth()">
  <img [src]="postInfo().img"
       class="object-cover h-96 rounded-xl group-hover:scale-105 duration-150 delay-100"
  >

  

  <div class="h-96 w-full rounded-xl absolute top-0 left-0
              bg-linear-to-t from-gray-900 to-transparent">
  </div>

  <div class="absolute top-0 h-96 px-4 py-8 flex flex-col gap-3 justify-end">
    <span class="text-3xl font-bold text-white">{{ postInfo().title }}</span>
    <p class="text-sm font-light text-white">{{ postInfo().description }}</p>
  </div>
</div>
