@if(activedDashboard()){
  <div class="fixed bg-gray-800/50 top-0 left-0 w-screen h-screen z-60"
       (click)="emitCloseDashboard()"
       [ngClass]="{'animate-fade-out-right': fadeOut}"
  >

  <!-- Dashboard -->
  <div class="fixed top-0 right-0 w-64 h-screen bg-white shadow-2xl z-60 p-6
              flex flex-col animate-slide-in-right rounded-l-xl"
       (click)="$event.stopPropagation()"
  >

    @if(!authService.loginSuccessful()){
      <div class="flex w-full gap-4 items-center py-2 px-2 mt-10 hover:bg-stone-200
                  duration-300 rounded-md justify-center">

        <lucide-angular [img]="User"
                        class="stroke-3 "
        ></lucide-angular>
        <button
          (click)="toggleLoginModal()"
          (click)="emitCloseDashboard()"
          class="text-gray-900 font-bold cursor-pointer"
        >
            Iniciar Sesión
        </button>
      </div>
    }


    <button
      (click)="emitCloseDashboard()"
      class="absolute top-4 right-4 text-gray-500 hover:text-gray-900 text-lg font-bold cursor-pointer"
      aria-label="Cerrar Panel"
    >
      <lucide-angular [img]="Close"></lucide-angular>
    </button>
  </div>


  </div>


}

<app-login-modal [activeLogin]="activedLoginModal"
                 (disableLoginModal)="toggleLoginModal()"
></app-login-modal>
