@if(activedDashboard()){
  <div class="fixed top-0 left-0 w-screen h-screen z-60"
       (click)="emitCloseDashboard()"
  >

  <!-- Dashboard -->
  <div class="fixed top-0 right-0 w-64 h-fit bg-white shadow-2xl z-60 p-6
              flex flex-col rounded-l-xl"
       (click)="$event.stopPropagation()"
  >

    @if(!authService.loginSuccessful()){
      <div class="flex w-full gap-3 items-center py-2 px-2 hover:bg-stone-200
                  duration-300 rounded-md">

        <lucide-angular [img]="User"
                        class="stroke-3 size-8"
        ></lucide-angular>
        <button
          (click)="toggleLoginModal()"
          (click)="emitCloseDashboard()"
          class="text-gray-900 font-bold cursor-pointer text-2xl"
        >
            Iniciar sesión
        </button>
      </div>
    }

    @if(authService.loginSuccessful()){
      <!-- Boton de perfil -->
      <div class="flex gap-3 items-center py-2 px-2 mt-10 hover:bg-stone-200
                  duration-300 rounded-md">

        <lucide-angular [img]="User"
                        class="stroke-3 size-8"
        ></lucide-angular>
        <a [routerLink]="['/profile',authService.userData()?.id]"
           (click)="emitCloseDashboard()"
           class="text-gray-900 font-bold cursor-pointer text-xl"
        >
            Perfil
        </a>
      </div>

    }

  </div>


  </div>


}

<app-login-modal [activeLogin]="activedLoginModal"
                 (disableLoginModal)="toggleLoginModal()"
></app-login-modal>
