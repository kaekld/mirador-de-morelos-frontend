@if( activedForm() ) {
    <div class="fixed top-0 left-0 bg-gray-800/50 h-screen w-screen z-60 duration-150 flex 
                justify-center items-center"
         (click)="emitCloseForm()"
    >
      <div class="h-1/2 md:h-11/12 w-5/6 md:w-1/2 flex bg-white rounded-2xl animate-fade-in-right
                  overflow-y-auto"
           (click)="$event.stopPropagation()"
      >

        <!-- Contenido  -->
        <div class="px-20 py-10 w-full h-full flex flex-col gap-6 justify-start">

            <h1 class="text-4xl font-extrabold w-fit mx-auto">
                NUEVO NEGOCIO
            </h1>

            <!-- Credenciales de usuario  -->
            <form class="flex flex-col gap-3" [formGroup]="placeRegisterForm">
              <!-- Nombre -->
              <fieldset class="flex flex-col gap-3 w-full">
                
                <input type="file" id="image" name="image"
                       class="focus:ring-2 focus:ring-stone-500 transition-all ease-out duration-150
                              outline-0 border-2 border-stone-400 py-2 px-2 font-normal w-full"
                       formControlName="image">
              
              </fieldset>
            
            </form>

        </div>

      </div>

    </div>
  }
